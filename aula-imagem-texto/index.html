<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>aula-imagem-texto</title>
    <link rel="stylesheet" href="css/style.css">
    
</head>
<body>
    <section class="secao-sobre">
    <!-- Aqui dentro vamos colocar a caixa da imagem e a caixa de texto -->
         <!-- Caixa da Imagem -->
    <div class="caixa-imagem">
        <!-- Salve uma imagem na pasta img e coloque o nome dela aqui embaixo: -->
        <img src="img/foto.png" alt="Imagem do nosso projeto">
    </div>
        <!-- Caixa do Texto -->
    <div class="caixa-texto">
        <h2>Conheça nosso projeto</h2>
        <p>Este texto está posicionado ao lado da imagem. Se você diminuir o tamanho da janela do navegador, o Flex Wrap vai entrar em ação e jogar este texto para a linha de baixo automaticamente!</p>
        <button>Saiba mais</button>
    </div>
</section>
    <script src="js/script.js"></script>
</body>
</html>
